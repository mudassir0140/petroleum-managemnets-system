<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | PetroManage</title>
    <style>
      :root { color-scheme: light dark; --bg: #f1f5f9; --fg: #1e293b; --muted: #475569; --card: #ffffff; --accent: #f59e0b; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --fg: #e2e8f0; --muted: #94a3b8; --card: #1e293b; } }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
      main { max-width: 28rem; width: 100%; background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 16px; }
      button { background: var(--accent); color: #1e293b; border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>This page has not been opened on this device yet. Pages you opened before are still available. Changes you make are saved on this device and sent when the connection returns.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
