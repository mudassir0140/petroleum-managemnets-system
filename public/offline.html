<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline - Petroleum Management System</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
      main { max-width: 28rem; text-align: center; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { font-size: .95rem; line-height: 1.5; color: #334155; }
      a { color: #b45309; font-weight: 600; }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; color: #f8fafc; }
        p { color: #cbd5e1; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>This page is not saved on this device, so it cannot load without internet.</p>
      <p>Pages you opened while online stay available. Sign-in pages need internet. Changes you make are saved on this device and sent when the internet returns.</p>
      <p><a href="/">Try again</a></p>
    </main>
    <script>
    // Back online: return to the app, which sends any changes saved on this device.
    window.addEventListener("online", function () { location.replace("/"); });
  </script>
</body>
</html>
